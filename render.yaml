services:
  - type: web
    name: truebalance-ledgerline
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: TrueBalance
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false

